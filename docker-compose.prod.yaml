services:

  
  backend:
    container_name: musecue_api
    image: thepujon/musecue_api:latest
    # build:
    #   context: ./
    #   dockerfile: Dockerfile  
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}
      DATABASE_HOST: postgres_db
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB}
      NODE_ENV: ${NODE_ENV}

      # true (default): BullMQ + Redis; false: PostgreSQL only (see README).
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USER: ${REDIS_USER}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # Private image storage. Values are interpolated at deploy time from the host
      # environment or this compose project's .env on the server; they are never
      # part of the image. Missing required values stop `docker-compose` early.
      PRIVATE_STORAGE_PROVIDER: ${PRIVATE_STORAGE_PROVIDER:-supabase}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL must be set for private image storage}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY must be set for private image storage}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:?SUPABASE_STORAGE_BUCKET must be set for private image storage}
      SUPABASE_STORAGE_TIMEOUT_MS: ${SUPABASE_STORAGE_TIMEOUT_MS:-15000}

      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 1000
    depends_on:
      - postgres_db
      - pg_admin
      - redis
    networks:
      - musecue_network
