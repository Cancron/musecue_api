<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset your MuseCue password</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        color: #333;
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
      }
      .container {
        background-color: #f9f9f9;
        border-radius: 8px;
        padding: 30px;
        border: 1px solid #ddd;
      }
      .header {
        text-align: center;
        margin-bottom: 30px;
      }
      .code-box {
        background-color: #fff;
        border: 2px solid #d66067;
        border-radius: 5px;
        padding: 20px;
        text-align: center;
        margin: 20px 0;
      }
      .code {
        font-size: 32px;
        font-weight: bold;
        color: #d66067;
        letter-spacing: 5px;
      }
      .footer {
        margin-top: 30px;
        text-align: center;
        font-size: 12px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Reset your MuseCue password</h1>
        <p>AI makeup guidance, made for your face.</p>
      </div>
      <p>Hi {{username}},</p>
      <p>Use this code to reset your MuseCue password:</p>

      <div class="code-box">
        <div class="code">{{resetCode}}</div>
      </div>

      <p>If you didn't request a password reset, you can ignore this email.</p>

      <p>With care,<br />The MuseCue Team</p>

      <div class="footer">
        <p>&copy; {{year}} MuseCue. All rights reserved.</p>
      </div>
    </div>
  </body>
</html>
