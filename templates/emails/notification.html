<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        color: #333;
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
      }
      .container {
        background-color: #f9f9f9;
        border-radius: 8px;
        padding: 30px;
        border: 1px solid #ddd;
      }
      .footer {
        margin-top: 30px;
        text-align: center;
        font-size: 12px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>{{title}}</h2>
      <p>Hi {{username}},</p>
      <p>{{message}}</p>
      <p>You can see all your notifications in the MuseCue app.</p>
    </div>
    <div class="footer">
      <p>&copy; {{year}} MuseCue. All rights reserved.</p>
    </div>
  </body>
</html>
