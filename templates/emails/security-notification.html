<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        color: #333;
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
      }
      .container {
        background-color: #f9f9f9;
        border-radius: 8px;
        padding: 30px;
        border: 1px solid #ddd;
      }
      .alert {
        border-left: 4px solid #d66067;
        padding-left: 12px;
        margin: 20px 0;
      }
      .footer {
        margin-top: 30px;
        font-size: 12px;
        color: #777;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>{{title}}</h2>
      <p>Hi {{username}},</p>
      <div class="alert">
        <p>{{description}}</p>
        <p>When: {{occurredAt}}</p>
      </div>
      <p>
        If this was you, there is nothing else to do. If it was not you, sign
        in to MuseCue, change your password and review your security settings
        at once.
      </p>
      <div class="footer">
        <p>&copy; {{year}} MuseCue. This is an automated security message.</p>
      </div>
    </div>
  </body>
</html>
